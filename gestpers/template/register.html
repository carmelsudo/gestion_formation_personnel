<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription — Plateforme INSTI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 380px;
            padding: 25px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #3b82f6;
            text-align: center;
            margin-bottom: 18px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #6b7280;
        }
        .tab.active {
            color: #3b82f6;
            border-bottom: 3px solid #3b82f6;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #374151;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #3b82f6;
            border: none;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .switch-text {
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            color: #6b7280;
        }
        .switch-text span {
            color: #3b82f6;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Plateforme INSTI – Enseignants</h2>

    <div class="tabs">
        <div class="tab active" id="login-tab">Connexion</div>
    </div>

    <!-- Connexion Formulaire -->
    <form method="post" class="form active" action="" id="login-form">
        <div class="form-group">
            {%csrf_token%}
         
            {{form.as_p}}
        <button type="submit" class="btn">Se connecter</button>
    </form>

   
</div>

<script>
    document.getElementById('login-tab').addEventListener('click', function() {
        document.getElementById('login-form').classList.add('active');
        document.getElementById('register-form').classList.remove('active');
        this.classList.add('active');
        document.getElementById('register-tab').classList.remove('active');
    });

    document.getElementById('register-tab').addEventListener('click', function() {
        document.getElementById('register-form').classList.add('active');
        document.getElementById('login-form').classList.remove('active');
        this.classList.add('active');
        document.getElementById('login-tab').classList.remove('active');
    });
</script>

</body>
</html>
