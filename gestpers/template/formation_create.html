<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post" enctype="multipart/form-data" action="{% url 'create_demande' %}" class="formation-form">
    {% csrf_token %}

    <h2>🎓 Créer une formation</h2>

    <div class="grid">
        <div>
            <label>Titre *</label>
            <input type="text" name="titre" required placeholder="Introduction au Machine Learning">
        </div>

        <div>
            <label>Auteur *</label>
            <input type="text" name="auteur" required placeholder="Dr. Sarah Chen">
        </div>

        <div>
            <label>Date début</label>
            <input type="date" name="debut">
        </div>

        <div>
            <label>Date fin</label>
            <input type="date" name="fin">
        </div>
    </div>

    <label>Type de formation *</label>
    <div class="radio-group">
        <label><input type="radio" name="type" value="presentiel" checked> Présentiel</label>
        <label><input type="radio" name="type" value="distanciel"> Distanciel</label>
    </div>

    <label>Objectifs *</label>
    <textarea name="objectifs" required placeholder="Compétences acquises..."></textarea>

    <label>Image</label>
    <input type="file" name="img_path" accept="image/*">

          <div class="actions">
        <button type="reset" class="btn cancel">Annuler</button>
        <button type="submit" class="btn submit">Créer</button>
    </div>
</form>
<style>
    .formation-form {
    max-width: 700px;
    margin: auto;
    padding: 30px;
    background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
    border-radius: 16px;
    font-family: sans-serif;
    box-shadow: 0 10px 25px rgba(0,0,0,.1);
}

.formation-form h2 {
    text-align: center;
    color: #0369a1;
    margin-bottom: 20px;
}

label {
    font-weight: 600;
    margin-top: 15px;
    display: block;
}

input, textarea, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #bae6fd;
    margin-top: 5px;
}

input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #0284c7;
    box-shadow: 0 0 0 2px #bae6fd;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

textarea {
    min-height: 100px;
}

.radio-group {
    display: flex;
    gap: 15px;
    margin-top: 8px;
}

.radio-group label {
    background: #e0f2fe;
    padding: 8px 12px;
    border-radius: 20px;
    cursor: pointer;
}

.actions {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
}

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}

.btn.submit {
    background: #0284c7;
    color: white;
}

.btn.submit:hover {
    background: #0369a1;
}

.btn.cancel {
    background: #e5e7eb;
}

</style>
</body>
</html>
