{% extends 'index.html' %}
{%  block maincontent %}

           
            <div class="content-wrapper">
                <div class="content-header">
                    <h1 class="content-title">Gestion des subordonnées</h1>
                    <p class="content-subtitle">Consultez et gérez tous vos subordonnée de votre plateforme</p>
                </div>
                
                <!-- Tableau des utilisateurs -->
                <div class="table-container">
                    <div class="table-responsive">
                        <table class="user-table" id="user-table">
                            <thead>
                                <tr>
                                    <th data-sort="id">ID <i class="fas fa-sort"></i></th>
                                    <th data-sort="name">Nom <i class="fas fa-sort"></i></th>
                                    <th data-sort="email">Email <i class="fas fa-sort"></i></th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <!-- Les données seront générées dynamiquement -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="pagination" id="pagination">
                        <!-- La pagination sera générée dynamiquement -->
                    </div>
                </div>
            </div>
  
      <script>

         const usersData = [
            {% for i in user.subordonnee %}
            {  
                 id: "{{i.user.id}}", 
                name: "{{i.user.username}}", 
                email: "{{i.user.email}}", 
                status: "{{i.user.status}}", 
                role: "{{i.user.role}}" 
            },
            {% endfor %}
           
                 ];
        let currentPage = 1;
         const itemsPerPage = 8;
        let filteredUsers = [...usersData];
        let sortColumn = 'id';
        let sortDirection = 'asc';
        const searchInput = document.getElementById('search-input');

       const tableBody = document.getElementById('table-body');

                // Filtrer le tableau
        function filterTable() {
            const searchTerm = searchInput.value.toLowerCase();
            
            if (searchTerm.length === 0) {
                filteredUsers = [...usersData];
            } else {
                filteredUsers = usersData.filter(user => 
                    user.name.toLowerCase().includes(searchTerm) || 
                    user.email.toLowerCase().includes(searchTerm) ||
                    user.role.toLowerCase().includes(searchTerm)
                );
            }
            
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // Trier le tableau
        function sortTable(column) {
            // Si on clique sur la même colonne, inverser le sens de tri
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            
            // Trier les données
            filteredUsers.sort((a, b) => {
                let aValue = a[column];
                let bValue = b[column];
                
                // Pour les colonnes spéciales
                if (column === 'status') {
                    const statusOrder = { 'active': 1, 'pending': 2, 'inactive': 3 };
                    aValue = statusOrder[aValue] || 4;
                    bValue = statusOrder[bValue] || 4;
                }
                
                if (aValue < bValue) return sortDirection === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });
            
            // Mettre à jour les icônes de tri
            updateSortIcons();
            
            // Re-rendre le tableau
            renderTable();
        }

        // Mettre à jour les icônes de tri
        function updateSortIcons() {
            const headers = document.querySelectorAll('.user-table th[data-sort]');
            
            headers.forEach(header => {
                const icon = header.querySelector('i');
                const column = header.getAttribute('data-sort');
                
                if (column === sortColumn) {
                    icon.className = sortDirection === 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down';
                } else {
                    icon.className = 'fas fa-sort';
                }
            });
        }

        // Rendre le tableau
        function renderTable() {
            // Calculer les utilisateurs à afficher pour la page actuelle
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const usersToShow = filteredUsers.slice(startIndex, endIndex);
            
            // Effacer le contenu actuel
            tableBody.innerHTML = '';
            
            // Ajouter les lignes du tableau
            usersToShow.forEach(user => {
                const row = document.createElement('tr');
                
                // Déterminer la classe CSS pour le statut
                let statusClass = '';
                let statusText = '';
                
                switch(user.status) {
                    case 'active':
                        statusClass = 'status-active';
                        statusText = 'Actif';
                        break;
                    case 'inactive':
                        statusClass = 'status-inactive';
                        statusText = 'Inactif';
                        break;
                    case 'pending':
                        statusClass = 'status-pending';
                        statusText = 'En attente';
                        break;
                }
                
                row.innerHTML = `
                    <td>#${user.id.toString().padStart(3, '0')}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>
                        <div class="action-buttons">
                           
                            <a href= "/subordonnés-view/${user.id}"" class="action-btn profile" data-id="${user.id}" title="Voir profil">
                                <i class="fas fa-eye"></i>
                            </a>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
            
            // Ajouter les événements aux boutons d'action
            document.querySelectorAll('.action-btn.edit').forEach(btn => {
                btn.addEventListener('click', () => openEditModal(parseInt(btn.getAttribute('data-id'))));
            });
            
            document.querySelectorAll('.action-btn.delete').forEach(btn => {
                btn.addEventListener('click', () => openDeleteModal(parseInt(btn.getAttribute('data-id'))));
            });
            
            document.querySelectorAll('.action-btn.profile').forEach(btn => {
                btn.addEventListener('click', () => openProfileModal(parseInt(btn.getAttribute('data-id'))));
            });
            
            // Ajouter les événements de tri aux en-têtes
            document.querySelectorAll('.user-table th[data-sort]').forEach(header => {
                header.addEventListener('click', () => sortTable(header.getAttribute('data-sort')));
            });
            
            // Initialiser les icônes de tri
            updateSortIcons();
        }

        // Rendre la pagination
        function renderPagination() {
            const totalPages = Math.ceil(filteredUsers.length / itemsPerPage);
            
            // Si une seule page, ne pas afficher la pagination
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let paginationHTML = '';
            
            // Bouton précédent
            paginationHTML += `
                <button class="pagination-btn" id="prev-page" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;
            
            // Pages
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    paginationHTML += `
                        <button class="pagination-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">
                            ${i}
                        </button>
                    `;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    paginationHTML += `<span class="pagination-dots">...</span>`;
                }
            }
            
            // Bouton suivant
            paginationHTML += `
                <button class="pagination-btn" id="next-page" ${currentPage === totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;
            
            pagination.innerHTML = paginationHTML;
            
            // Ajouter les événements
            document.getElementById('prev-page')?.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                    renderPagination();
                }
            });
            
            document.getElementById('next-page')?.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable();
                    renderPagination();
                }
            });
            
            document.querySelectorAll('.pagination-btn[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = parseInt(btn.getAttribute('data-page'));
                    renderTable();
                    renderPagination();
                });
            });
        }

        // Ouvrir modal d'édition
        function openEditModal(userId) {
            const user = usersData.find(u => u.id === userId);
            if (!user) return;
            
            // Animation de chargement
            showLoading();
            
            // Simuler un délai de chargement
            setTimeout(() => {
                hideLoading();
                
                document.getElementById('modal-title').textContent = `Modifier ${user.name}`;
                
                document.getElementById('modal-body').innerHTML = `
                    <div class="form-group">
                        <label for="edit-name">Nom complet</label>
                        <input type="text" id="edit-name" class="search-input" value="${user.name}" style="width: 100%; margin-top: 8px;">
                    </div>
                    <div class="form-group" style="margin-top: 16px;">
                        <label for="edit-email">Adresse email</label>
                        <input type="email" id="edit-email" class="search-input" value="${user.email}" style="width: 100%; margin-top: 8px;">
                    </div>
                    <div class="form-group" style="margin-top: 16px;">
                        <label for="edit-role">Rôle</label>
                        <select id="edit-role" class="search-input" style="width: 100%; margin-top: 8px;">
                            <option value="Administrateur" ${user.role === 'Administrateur' ? 'selected' : ''}>Administrateur</option>
                            <option value="Modérateur" ${user.role === 'Modérateur' ? 'selected' : ''}>Modérateur</option>
                            <option value="Éditeur" ${user.role === 'Éditeur' ? 'selected' : ''}>Éditeur</option>
                            <option value="Utilisateur" ${user.role === 'Utilisateur' ? 'selected' : ''}>Utilisateur</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-top: 16px;">
                        <label for="edit-status">Statut</label>
                        <select id="edit-status" class="search-input" style="width: 100%; margin-top: 8px;">
                            <option value="active" ${user.status === 'active' ? 'selected' : ''}>Actif</option>
                            <option value="inactive" ${user.status === 'inactive' ? 'selected' : ''}>Inactif</option>
                            <option value="pending" ${user.status === 'pending' ? 'selected' : ''}>En attente</option>
                        </select>
                    </div>
                `;
                
                document.getElementById('modal-footer').innerHTML = `
                    <button class="btn btn-secondary" id="cancel-edit">Annuler</button>
                    <button class="btn btn-primary" id="save-edit">Enregistrer</button>
                `;
                
                // Événements pour les boutons du modal
                document.getElementById('cancel-edit').addEventListener('click', closeModal);
                document.getElementById('save-edit').addEventListener('click', () => {
                    // Simulation de sauvegarde
                    showLoading();
                    setTimeout(() => {
                        hideLoading();
                        closeModal();
                        alert(`Modifications pour ${user.name} enregistrées (simulation)`);
                    }, 1000);
                });
                
                openModal();
            }, 500);
        }

        // Ouvrir modal de suppression
        function openDeleteModal(userId) {
            const user = usersData.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('modal-title').textContent = `Supprimer l'utilisateur`;
            
            document.getElementById('modal-body').innerHTML = `
                <p>Êtes-vous sûr de vouloir supprimer l'utilisateur <strong>${user.name}</strong> ?</p>
                <p>Cette action est irréversible.</p>
            `;
            
            document.getElementById('modal-footer').innerHTML = `
                <button class="btn btn-secondary" id="cancel-delete">Annuler</button>
                <button class="btn btn-danger" id="confirm-delete">Supprimer</button>
            `;
            
            // Événements pour les boutons du modal
            document.getElementById('cancel-delete').addEventListener('click', closeModal);
            document.getElementById('confirm-delete').addEventListener('click', () => {
                // Simulation de suppression
                showLoading();
                setTimeout(() => {
                    hideLoading();
                    closeModal();
                    alert(`Utilisateur ${user.name} supprimé (simulation)`);
                }, 1000);
            });

            openModal();
        }
    document.addEventListener('DOMContentLoaded', function() {
          
            
          
            renderTable();
            
           
            renderPagination();
            

            // Recherche en temps réel
            searchInput.addEventListener('input', filterTable);
        });
  
  </script>
            {%  endblock maincontent %}
